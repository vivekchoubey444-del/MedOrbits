<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100B0A">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="MedOrbits is temporarily unavailable while maintenance is in progress.">
  <title>Maintenance | MedOrbits</title>
  <link rel="icon" href="/assets/images/logo/medorbits-logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .maintenance{min-height:68vh;display:grid;place-items:center;padding:54px 0;background:radial-gradient(ellipse at 50% 35%,rgba(112,37,53,.2),transparent 44%),linear-gradient(145deg,#100b0a,#211317 58%,#2a171d)}
    .maintenance__body{width:min(760px,100%);padding:clamp(24px,5vw,54px);border:1px solid var(--line);border-radius:12px;background:rgba(24,15,17,.92);text-align:center}
    .maintenance__mark{width:70px;height:70px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid rgba(199,164,102,.55);border-radius:50%;color:#ead8ae;font:600 25px 'Playfair Display',Georgia,serif}
    .maintenance h1{margin:12px 0;color:var(--white);font:600 clamp(27px,4vw,42px)/1.2 'Playfair Display',Georgia,serif}
    .maintenance p{max-width:570px;margin:0 auto;color:var(--muted);font-size:14px;line-height:1.8}
    .maintenance__actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:24px}
    @media(max-width:520px){.maintenance__actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.maintenance__actions a{min-width:0}}
  </style>
</head>
<body>
  <main class="maintenance" id="main-content">
    <section class="container maintenance__body" aria-labelledby="maintenanceTitle">
      <div class="maintenance__mark" aria-hidden="true">MO</div>
      <span class="kicker">Temporary maintenance</span>
      <h1 id="maintenanceTitle">We will be back soon.</h1>
      <p>MedOrbits is temporarily unavailable while scheduled maintenance is in progress. Please try again later. No payment is required on this page.</p>
      <div class="maintenance__actions"><a class="btn" href="/index.html">Try homepage</a><a class="btn btn-outline" href="mailto:support@medorbits.in">Email support</a></div>
    </section>
  </main>
</body>
</html>
