name: Update package-lock.json
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-lockfile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify package.json
        run: test -f package.json
      - name: Generate and synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (lock.lockfileVersion !== 3) {
            throw new Error('Expected lockfileVersion 3.');
          }
          if (
            pkg.name !== lock.name ||
            pkg.version !== lock.version
          ) {
            throw new Error(
              'package.json and package-lock.json metadata differ.'
            );
          }
          const placeholders = Object.entries(lock.packages || {})
            .filter(([path, entry]) =>
              path !== '' &&
              typeof entry.integrity === 'string' &&
              entry.integrity.includes('PLACEHOLDER')
            );
          if (placeholders.length) {
            throw new Error(
              'Placeholder integrity hashes remain in package-lock.json.'
            );
          }
          console.log('Lockfile validation passed.');
          NODE
      - name: Check for lockfile changes
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi
      - name: Commit and push lockfile
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}