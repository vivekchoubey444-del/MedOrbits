name: MedOrbits Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-integration-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # --------------------------------------------------
      # 2. SET UP NODE.JS
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # --------------------------------------------------
      # 3. VERIFY PROJECT STRUCTURE
      # --------------------------------------------------
      - name: Verify project metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json package-lock.json server.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done
          for directory in scripts tests src; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Required directory is missing: $directory"
              exit 1
            fi
          done
          node --version
          npm --version
      # --------------------------------------------------
      # 4. VALIDATE PACKAGE METADATA
      # --------------------------------------------------
      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );
          const lock = JSON.parse(
            fs.readFileSync('package-lock.json', 'utf8')
          );
          if (!pkg.name) {
            throw new Error('package.json must define a package name');
          }
          if (!lock.packages || !lock.packages['']) {
            throw new Error(
              'package-lock.json is missing its root package entry'
            );
          }
          if (pkg.name !== lock.packages[''].name) {
            throw new Error(
              'package.json and package-lock.json names do not match'
            );
          }
          if (
            pkg.version &&
            lock.packages[''].version &&
            pkg.version !== lock.packages[''].version
          ) {
            throw new Error(
              'package.json and package-lock.json versions do not match'
            );
          }
          const requiredScripts = [
            'start',
            'test',
            'check:json',
            'check:data',
            'lint',
            'format:check',
            'test:coverage'
          ];
          const missing = requiredScripts.filter(
            (name) => typeof pkg.scripts?.[name] !== 'string'
          );
          if (missing.length) {
            throw new Error(
              `Missing npm scripts: ${missing.join(', ')}`
            );
          }
          console.log('Package metadata and required scripts validated.');
          NODE
      # --------------------------------------------------
      # 5. INSTALL LOCKED DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci
        env:
          CI: true
      # --------------------------------------------------
      # 6. VALIDATE JSON
      # --------------------------------------------------
      - name: Validate JSON files
        run: npm run check:json
      # --------------------------------------------------
      # 7. VALIDATE APPLICATION DATA
      # --------------------------------------------------
      - name: Validate application data
        run: npm run check:data
      # --------------------------------------------------
      # 8. CHECK JAVASCRIPT SYNTAX
      # --------------------------------------------------
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find src scripts tests -type f \
              \( -name '*.js' -o -name '*.cjs' \) \
              -not -path '*/node_modules/*' \
              -print0
          )
      # --------------------------------------------------
      # 9. CHECK FORMATTING
      # --------------------------------------------------
      - name: Check code formatting
        run: npm run format:check
      # --------------------------------------------------
      # 10. RUN ESLINT
      # --------------------------------------------------
      - name: Run ESLint
        run: npm run lint
      # --------------------------------------------------
      # 11. RUN TESTS AND COVERAGE
      # --------------------------------------------------
      - name: Run unit tests with coverage
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:ci
      # --------------------------------------------------
      # 12. UPLOAD TEST ARTIFACTS
      # --------------------------------------------------
      - name: Upload test coverage and results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: medorbits-test-results
          path: |
            coverage/
            test-results/
            junit.xml
          if-no-files-found: ignore
          retention-days: 14
