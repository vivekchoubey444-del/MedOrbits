name: MedOrbits Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-integration-tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify project metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify test script exists
        run: node -e "if (!require('./package.json').scripts?.test) { console.error('Missing scripts.test in package.json'); process.exit(1); }"
      - name: Run unit and integration tests
        run: npm test
      - name: Upload test coverage and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage/
            test-results/
            junit.xml
          if-no-files-found: ignore
          retention-days: 14