steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: false
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: package-lock.json
  - name: Verify required project files
    shell: bash
    run: |
      set -euo pipefail
      test -f package.json
      test -f package-lock.json
      test -f server.js
      test -f .gitignore
      echo "Required project files found."
  - name: Install dependencies
    run: npm ci
  - name: Check server JavaScript syntax
    run: node --check server.js
  - name: Check application JavaScript syntax
    shell: bash
    run: |
      set -euo pipefail
      if [ ! -d src ]; then
        echo "No src/ directory found; skipping application syntax check."
        exit 0
      fi
      mapfile -d '' files < <(
        find src -type f -name '*.js' -print0
      )
      if [ "${#files[@]}" -eq 0 ]; then
        echo "No JavaScript files found in src/."
        exit 0
      fi
      for file in "${files[@]}"; do
        echo "Checking $file"
        node --check "$file"
      done
  - name: Run lint
    run: npm run lint --if-present
  - name: Check formatting
    run: npm run format:check --if-present
  - name: Run tests
    run: npm run test --if-present