steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      persist-credentials: false

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Validate required root files
    shell: bash
    run: |
      set -euo pipefail

      required_files=(
        "package.json"
        "README.md"
        ".editorconfig"
        ".prettierrc.json"
        ".eslintrc.json"
      )

      for file in "${required_files[@]}"; do
        if [[ ! -f "$file" ]]; then
          echo "::error file=$file::Required file is missing."
          exit 1
        fi

        echo "Found: $file"
      done

  - name: Validate JSON files
    shell: bash
    run: |
      set -euo pipefail

      count=0
      failures=0

      while IFS= read -r -d '' file; do
        count=$((count + 1))
        echo "Checking JSON: $file"

        if node - "$file" <<'NODE'
      const fs = require('node:fs');
      const file = process.argv[2];

      try {
        JSON.parse(fs.readFileSync(file, 'utf8'));
        console.log(`Valid JSON: ${file}`);
      } catch (error) {
        console.error(`Invalid JSON in ${file}`);
        console.error(error.message);
        process.exitCode = 1;
      }
      NODE
        then
          :
        else
          failures=$((failures + 1))
          echo "::error file=$file::Invalid JSON. See the parser error above."
        fi
      done < <(
        find . \
          -type d $begin:math:text$ \-name \.git \-o \-name node\_modules \-o \-name coverage $end:math:text$ -prune -o \
          -type f -name '*.json' -print0
      )

      echo "Checked $count JSON file(s)."
      echo "Invalid JSON files: $failures"

      if (( failures > 0 )); then
        exit 1
      fi

  - name: Validate YAML syntax
    shell: ruby {0}
    run: |
      require 'yaml'
      require 'find'

      count = 0

      Find.find('.') do |path|
        if File.directory?(path) &&
           %w[.git node_modules coverage].include?(File.basename(path))
          Find.prune
        elsif File.file?(path) &&
              path.match?(/\.(yml|yaml)\z/i)
          puts "Checking YAML: #{path}"
          YAML.parse_file(path)
          count += 1
        end
      end

      puts "Validated #{count} YAML file(s)."

  - name: Validate package metadata
    run: |
      node <<'NODE'
      const fs = require('node:fs');
      const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

      if (typeof pkg.name !== 'string' || !pkg.name.trim()) {
        throw new Error('package.json is missing a valid name');
      }

      if (typeof pkg.version !== 'string' || !pkg.version.trim()) {
        throw new Error('package.json is missing a valid version');
      }

      console.log('Package name:', pkg.name);
      console.log('Package version:', pkg.version);
      NODE

  - name: Validate Prettier configuration
    run: |
      node -e \
        "JSON.parse(require('node:fs').readFileSync('.prettierrc.json', 'utf8'))"

  - name: Validate ESLint configuration
    run: |
      node -e \
        "JSON.parse(require('node:fs').readFileSync('.eslintrc.json', 'utf8'))"