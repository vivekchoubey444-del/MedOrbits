name: MedOrbits Configuration Validation
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate configuration files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required root files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "package.json"
            "README.md"
            ".editorconfig"
            ".prettierrc.json"
            ".eslintrc.json"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing."
              exit 1
            fi
            echo "Found: $file"
          done
      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            echo "Checking JSON: $file"
            node -e \
              "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" \
              "$file"
          done < <(
            find . \
              -type d \( -name node_modules -o -name .git -o -name coverage \) -prune \
              -o -type f -name '*.json' -print0
          )
          echo "Validated $count JSON file(s)."
      - name: Validate YAML syntax
        shell: ruby {0}
        run: |
          require 'yaml'
          require 'find'
          count = 0
          Find.find('.') do |path|
            if File.directory?(path) &&
               %w[.git node_modules coverage].include?(File.basename(path))
              Find.prune
            elsif File.file?(path) &&
                  path.match?(/\.(yml|yaml)\z/i)
              puts "Checking YAML: #{path}"
              YAML.parse_file(path)
              count += 1
            end
          end
          puts "Validated #{count} YAML file(s)."
      - name: Validate package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (typeof pkg.name !== 'string' || !pkg.name.trim()) {
            throw new Error('package.json is missing a valid name');
          }
          if (typeof pkg.version !== 'string' || !pkg.version.trim()) {
            throw new Error('package.json is missing a valid version');
          }
          console.log('Package name:', pkg.name);
          console.log('Package version:', pkg.version);
          NODE
      - name: Validate Prettier configuration
        run: |
          node -e \
            "JSON.parse(require('node:fs').readFileSync('.prettierrc.json', 'utf8'))"
      - name: Validate ESLint configuration
        run: |
          node -e \
            "JSON.parse(require('node:fs').readFileSync('.eslintrc.json', 'utf8'))"