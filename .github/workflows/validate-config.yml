
name: MedOrbits Configuration Validation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required root files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "package.json"
            "README.md"
            ".editorconfig"
            ".prettierrc.json"
            ".eslintrc.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing."
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking JSON: $file"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(
            find . \
              -type d \( -name node_modules -o -name .git -o -name coverage \) -prune \
              -o -type f -name '*.json' -print0
          )

      - name: Validate YAML files
        run: |
          ruby -e '
            require "yaml"
            require "find"

            Find.find(".") do |path|
              if File.directory?(path) &&
                 %w[.git node_modules coverage].include?(File.basename(path))
                Find.prune
              elsif File.file?(path) &&
                    path.match?(/\.(yml|yaml)\z/i)
                puts "Checking YAML: #{path}"
                YAML.parse_file(path)
              end
            end
          '

      - name: Validate package metadata
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            if (!pkg.name) throw new Error('package.json is missing name');
            if (!pkg.version) throw new Error('package.json is missing version');

            console.log('Package name:', pkg.name);
            console.log('Package version:', pkg.version);
          "

      - name: Validate Prettier configuration
        run: node -e "JSON.parse(require('fs').readFileSync('.prettierrc.json', 'utf8'))"

      - name: Validate ESLint configuration
        run: node -e "JSON.parse(require('fs').readFileSync('.eslintrc.json', 'utf8'))"
        
