
name: Generate Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: generate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate package lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate generated lockfile
        run: node -e "const l=JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); if (!l.lockfileVersion) throw new Error('Invalid lockfile'); console.log('Lockfile valid')"

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
