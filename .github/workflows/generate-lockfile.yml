
name: Generate Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: generate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package.json
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if (!p.name || !p.version) throw new Error('Missing package name or version'); console.log('package.json is valid')"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile JSON
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if (!l.lockfileVersion) throw new Error('Missing lockfileVersion'); if (l.name && l.name !== p.name) throw new Error('Package name mismatch'); console.log('Lockfile JSON is valid')"

      - name: Verify lockfile consistency
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
