name: Security vulnerability report
description: Read the private reporting instructions for suspected MedOrbits vulnerabilities
title: "[Security]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Important: protect sensitive information
        **This form creates a public GitHub issue. It is not a private
        vulnerability reporting channel.**
        Do not submit exploit steps, proof-of-concept code, credentials,
        tokens, private user data, payment information, or other sensitive
        technical details here.
        First read the repository's SECURITY.md file for reporting
        instructions. If no private reporting channel is available,
        ask a maintainer through a non-public channel to provide one
        before sharing sensitive information.
  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Required acknowledgment
      options:
        - label: I understand that this form creates a publicly visible issue.
          required: true
        - label: I will not include sensitive technical details or personal data.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Non-sensitive summary (optional)
      description: |
        Only provide a general summary if it is safe to disclose publicly.
        Otherwise, leave this blank and contact a maintainer privately.
      placeholder: General topic only; do not include exploit details.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## Next steps
        1. Read `SECURITY.md` in the repository.
        2. Use an explicitly published private reporting channel, if available.
        3. If no private channel is available, request one privately before
           sending sensitive technical details.
        Do not assume that a contact address or private reporting feature
        exists unless it is explicitly available.