openapi: 3.1.0

info:
  title: MedOrbits API
  version: 1.0.0
  summary: API contract for the MedOrbits education and career platform.
  description: |
    Initial API contract for MedOrbits.

    This specification documents intended API behavior and must be verified
    against the implemented server, middleware, database schema, and
    payment-provider integration before being treated as authoritative.

    The server URL is a placeholder. Replace it with the deployed API base URL.

    Security requirements:
      - Authenticate and authorize protected operations on the server.
      - Validate and normalize all user-controlled input.
      - Avoid disclosing account existence in authentication recovery flows.
      - Never trust client-submitted payment status or role assignments.
      - Verify payment-provider webhook signatures before processing events.
      - Return consistent errors without exposing stack traces or secrets.

    Contract conventions:
      - JSON is used for request and response bodies unless stated otherwise.
      - Identifiers are represented as strings in this initial public contract.
      - Pagination is one-based.
      - Unimplemented or unverified operations must not be treated as available.

  contact:
    name: MedOrbits API Team

  license:
    name: Proprietary

servers:
  - url: https://example.invalid/api
    description: PLACEHOLDER -- replace with the deployed API base URL.

tags:
  - name: Health
    description: Service availability and readiness.
  - name: Authentication
    description: User authentication and session management.
  - name: Courses
    description: Public course discovery.
  - name: Applications
    description: Authenticated application management.
  - name: Jobs
    description: Published job discovery.
  - name: Payments
    description: Payment-provider webhook integration.

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: |
        Returns the service health state. Confirm whether this endpoint
        represents liveness, readiness, or both in the deployed server.
        Do not expose secrets, environment variables, or sensitive
        infrastructure details.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a user
      description: |
        Authenticates a user with the supplied credentials.

        If the implementation uses cookie-based sessions, establish the
        session using an appropriately configured Set-Cookie response.
        Do not return passwords, password hashes, or session secrets in
        the response body.

        Apply rate limiting and return a generic authentication failure
        that does not unnecessarily disclose account existence.
      operationId: login
      security: []
      requestBody:
        required: true
        description: User credentials.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: |
                Session cookie when cookie-based authentication is used.
                Actual cookie attributes are configured by the server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: AUTHENTICATION_FAILED
                  message: Unable to authenticate with the supplied credentials.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: End the current session
      description: |
        Ends the authenticated user's current session.

        The server must invalidate the session where applicable and clear
        the session cookie using compatible cookie attributes.

        This operation is an addition to the initial scaffold. Confirm
        the actual route and logout behavior before enabling it.
      operationId: logout
      security:
        - sessionAuth: []
      responses:
        '204':
          description: Session ended successfully.
          headers:
            Set-Cookie:
              description: Expired session cookie when cookie authentication is used.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current authenticated user
      description: |
        Returns the identity and permitted account information associated
        with the current session. Never return password hashes, session
        secrets, or other authentication credentials.

        This operation is a proposed addition. Confirm that the backend
        exposes an equivalent endpoint before using it.
      operationId: getCurrentUser
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /courses:
    get:
      tags:
        - Courses
      summary: List available courses
      description: |
        Returns published or otherwise publicly available courses according
        to the platform's visibility rules.

        Pagination parameters are one-based. The actual response structure
        must be aligned with the existing course service.
      operationId: listCourses
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          description: Optional text search across supported course fields.
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: category
          in: query
          required: false
          description: Filter by a supported course category.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Paginated course results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /applications:
    get:
      tags:
        - Applications
      summary: List the authenticated user's applications
      description: |
        Returns applications owned by the authenticated user, subject to
        server-side authorization and data-access policies.

        Never allow a client to retrieve another user's applications by
        changing a query parameter or identifier.
      operationId: listApplications
      security:
        - sessionAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: Filter by a status supported by the application service.
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Paginated applications belonging to the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Applications
      summary: Create an application
      description: |
        Creates an application for the authenticated user.

        The server must validate that the requested course and optional
        institution exist and are eligible for application submission.
        The server determines ownership from the authenticated session,
        not from a client-supplied user ID.

        Confirm whether the implementation creates a draft or immediately
        submits an application before defining its final business semantics.
      operationId: createApplication
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
            example:
              courseId: course_123
              institutionId: institution_456
      responses:
        '201':
          description: Application created.
          headers:
            Location:
              description: Relative or absolute URI identifying the created resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested course or institution was not found or is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request conflicts with application business rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs:
    get:
      tags:
        - Jobs
      summary: Search published jobs
      description: |
        Returns published jobs visible to the requesting user.

        Only expose public listing fields. Do not return private employer
        details, applicant records, or internal moderation information
        unless separately authorized.
      operationId: listJobs
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          description: Optional text search over supported job fields.
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: location
          in: query
          required: false
          description: Optional location filter.
          schema:
            type: string
            minLength: 1
            maxLength: 150
        - name: employmentType
          in: query
          required: false
          description: Filter by a supported employment type.
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: Paginated published job results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /payments/webhook:
    post:
      tags:
        - Payments
      summary: Receive a payment-provider webhook
      description: |
        Receives an event from the configured payment provider.

        This endpoint must verify the provider's signature using the exact
        raw request body and the provider's documented verification method
        before trusting or processing the event.

        Validate event identifiers, event types, and relevant payment
        references. Process events idempotently to prevent duplicate
        payment updates. Do not trust browser-submitted payment status.

        The signature header, content type, payload, and response semantics
        are provider-specific and must be documented after a provider is
        selected.

        The JSON schema below is intentionally not specified because the
        provider's actual event format is not yet established.
      operationId: receivePaymentWebhook
      security: []
      parameters:
        - name: X-Provider-Signature
          in: header
          required: true
          description: |
            Illustrative signature-header name only. Replace it with the
            exact header required by the selected payment provider.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific event payload; schema not yet defined.
              additionalProperties: true
      responses:
        '200':
          description: Event accepted or already processed.
        '400':
          description: Invalid or malformed event.
        '401':
          description: Signature verification failed.
        '413':
          description: Request body exceeds the configured size limit.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Cookie-based session authentication.

        Replace the cookie name with the actual configured session-cookie
        name. The server must validate the session and enforce authorization
        on every protected operation.

        If the backend uses bearer tokens instead, define the corresponding
        HTTP bearer scheme and document its actual behavior.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is malformed or contains invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: The request could not be processed.

    Unauthorized:
      description: Authentication is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication is required.

    Forbidden:
      description: The authenticated user is not authorized to perform the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You are not permitted to perform this operation.

    ValidationError:
      description: The request failed input or business validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: One or more fields are invalid.
              details:
                - field: courseId
                  message: A valid course identifier is required.

    UnsupportedMediaType:
      description: The request content type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimitExceeded:
      description: The request rate limit has been exceeded.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying, when provided.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests. Please try again later.

    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred.

    ServiceUnavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: The service is temporarily unavailable.

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Indicates that the service reports itself as healthy.

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Registered email address.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Account password. Never log or return this value.

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          type: string
          minLength: 1
          description: Public or API-facing user identifier.
        name:
          type:
            - string
            - 'null'
          maxLength: 200
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          description: Include only if supported by the account model.
        role:
          type: string
          description: |
            Include only the role information permitted by the application's
            authorization and disclosure policy.

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Total matching records, if the service provides an exact count.
        totalPages:
          type: integer
          minimum: 0
          description: Total pages based on the selected page size.

    Course:
      type: object
      additionalProperties: true
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 220
        category:
          type: string
          maxLength: 100
        description:
          type:
            - string
            - 'null'
        durationMonths:
          type:
            - integer
            - 'null'
          minimum: 1

    CourseListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApplicationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - courseId
      properties:
        courseId:
          type: string
          minLength: 1
          maxLength: 100
        institutionId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 100
          description: Optional institution identifier, if supported.
      description: |
        Do not accept a userId as an ownership authority from the client.
        Derive application ownership from the authenticated user.

    Application:
      type: object
      additionalProperties: true
      required:
        - id
        - courseId
        - status
      properties:
        id:
          type: string
          minLength: 1
        courseId:
          type: string
          minLength: 1
        institutionId:
          type:
            - string
            - 'null'
        status:
          type: string
          description: |
            Application status defined by the implemented application
            service. Confirm the exact permitted status values.
        createdAt:
          type: string
          format: date-time

    ApplicationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Application'

    ApplicationListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Job:
      type: object
      additionalProperties: true
      required:
        - id
        - title
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 250
        slug:
          type: string
          maxLength: 270
        employmentType:
          type: string
          maxLength: 50
        workplaceType:
          type: string
          maxLength: 50
        location:
          type:
            - string
            - 'null'
          maxLength: 200
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time

    JobListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 100
              description: Stable machine-readable error code.
            message:
              type: string
              minLength: 1
              maxLength: 500
              description: Safe human-readable error message.
            requestId:
              type: string
              maxLength: 200
              description: Optional request identifier for troubleshooting.
            details:
              type: array
              description: Optional field-level validation details.
              items:
                type: object
                additionalProperties: false
                required:
                  - message
                properties:
                  field:
                    type: string
                    maxLength: 200
                  message:
                    type: string
                    minLength: 1
                    maxLength: 500